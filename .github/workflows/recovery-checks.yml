name: Recovery checks
on:
  pull_request:
  push:
    branches: ['codex/portal-recovery-2026-11-26']
permissions:
  contents: read
jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/recovery.test.mjs
      - run: npm install --ignore-scripts
      - run: npm run build
